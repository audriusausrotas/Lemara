name: Deploy Lemara Frontend

on:
  push:
    branches:
      - main

  repository_dispatch:
    types:
      - prismic_publish

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Build
        env:
          NEXT_PUBLIC_HCAPTCHA_SITEKEY: ${{ secrets.NEXT_PUBLIC_HCAPTCHA_SITEKEY }}
          SERVICE_ID: ${{ secrets.SERVICE_ID }}
          TEMPLATE_ID: ${{ secrets.TEMPLATE_ID }}
          KEY: ${{ secrets.KEY }}
          HCAPTCHA_SECRET_KEY: ${{ secrets.HCAPTCHA_SECRET_KEY }}
        run: npm run build

      - name: Prepare standalone
        run: |
          cp -r .next/static .next/standalone/.next/
          if [ -d public ]; then cp -r public .next/standalone/; fi

      - name: Upload build to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: ".next/standalone/*"
          target: "/var/www/lemara"
          strip_components: 2

      - name: Restart frontend
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /var/www/lemara
            PORT=5100 HOST=0.0.0.0 pm2 reload Lemara --update-env || \
            PORT=5100 HOST=0.0.0.0 pm2 start server.js --name "Lemara"
            pm2 save
